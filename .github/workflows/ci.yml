name: RISC-n-Roll-CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show configured stage
        run: |
          echo "Checking RISC-V project"
          grep -E '^stage:' rnr-stage.yaml
